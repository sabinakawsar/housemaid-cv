<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Housemaid CV — MRZ Scanner</title>
<style>body{font:16px system-ui;background:#f4f7fb;color:#15243a;margin:0}main{max-width:760px;margin:35px auto;padding:0 16px}section{background:white;border:1px solid #dde5ef;border-radius:14px;padding:22px;margin:16px 0}h1{font-size:28px}label{display:block;margin:13px 0 5px;font-weight:600}input,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #bdcad9;border-radius:8px;font:inherit}textarea{height:130px}button{background:#2459b9;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.5}img{max-width:100%;max-height:280px;display:block;margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}@media(max-width:550px){.grid{display:block}}small{color:#61718a}#status{font-weight:600}</style>
<main><h1>Passport MRZ Scanner</h1><p>One scan. Read the two MRZ lines at the bottom of a passport. Review before use.</p>
<section><label>Passport image</label><input type="file" id="file" accept="image/*"><img id="preview" hidden><button id="scan" disabled>Scan MRZ</button><p id="status">Choose a passport image.</p><small>Free Tesseract.js OCR runs in your browser. The language model downloads on first use; images are not sent to our server.</small></section>
<section><h2>Extracted details</h2><div class="grid"><div><label>Full name</label><input id="name"></div><div><label>Passport number</label><input id="passport"></div><div><label>Date of birth</label><input id="dob"></div><div><label>Expiry date</label><input id="doe"></div><div><label>District (manual)</label><input id="district" placeholder="Not encoded in MRZ"></div></div><p id="validation"></p></section>
<section><label>Raw MRZ OCR (editable)</label><textarea id="raw" placeholder="Paste the two MRZ lines here to test without scanning"></textarea><button id="parse">Parse text</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let worker=null,busy=false;
$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;$('preview').src=URL.createObjectURL(f);$('preview').hidden=false;$('scan').disabled=false};
const digit=s=>{let sum=0;for(let i=0;i<s.length;i++){const c=s[i],v=c==='<'?0:/\d/.test(c)?+c:c.charCodeAt(0)-55;sum+=v*[7,3,1][i%3]}return String(sum%10)};
const date=(s,birth)=>{if(!/^\d{6}$/.test(s))return '';let y=2000+ +s.slice(0,2);const now=new Date().getFullYear();if(birth&&y>now)y-=100;if(!birth&&y<now-15)y+=100;const iso=y+'-'+s.slice(2,4)+'-'+s.slice(4,6);return !Number.isNaN(Date.parse(iso))?iso:''};
function parse(text){
const lines=text.toUpperCase().split(/\r?\n/).map(s=>s.replace(/[^A-Z0-9<]/g,''));
let best=null;
for(let i=0;i<lines.length;i++){
const a=lines[i];if(!a.startsWith('P<BGD'))continue;
const m=a.match(/^P<BGD([A-Z]{2,})<<(.+)$/);if(!m)continue;
const surname=m[1],given=m[2].split(/<{2,}|[LK]{5,}/)[0].split('<').filter(x=>x&&x!=='L'&&x!=='K').join(' ').trim();
for(let j=i+1;j<=Math.min(i+2,lines.length-1);j++){
const b=lines[j];if(!/^[A-Z0-9<]{40,}$/.test(b))continue;
const p=b.slice(0,9),dob=b.slice(13,19),exp=b.slice(21,27);
const checks=[digit(p)===b[9],digit(dob)===b[19],digit(exp)===b[27]];
const score=checks.filter(Boolean).length;
const item={name:(given+' '+surname).trim(),passport:checks[0]?p.replace(/</g,''):'',dob:checks[1]?date(dob,true):'',doe:checks[2]?date(exp,false):'',score};
if(!best||item.score>best.score)best=item;
}}
// Prefer readable printed passport labels when MRZ letters are joined or corrupted.
const rows=text.toUpperCase().split(/\r?\n/).map(s=>s.trim());
const clean=s=>s.replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
const valueAfter=(label)=>{
 for(let i=0;i<rows.length;i++)if(label.test(rows[i])){
  for(let j=i+1;j<=Math.min(i+2,rows.length-1);j++){
   const v=clean(rows[j]);if(/^(?:MD|MST|ABU|MOHAMMAD|[A-Z]{3,})(?: [A-Z]{3,}){0,3}$/.test(v)&&!/(?:NAME|PASSPORT|NATIONALITY|COUNTRY|GIVEN|SURNAME|BANGLADESH)/.test(v))return v;
  }
 }return '';
};
const printedSurname=valueAfter(/\bSURNAME\b/);
const printedGiven=valueAfter(/\bGIVEN\s*NAME\b/);
let printedName=printedGiven&&printedSurname?printedGiven+' '+printedSurname:'';
// OCR often appends short junk words to Given Name; prefer a clean name
// from the personal-data heading when it agrees with the printed surname.
const header=text.toUpperCase().split(/FATHER|MOTHER|PERMANENT ADDRESS|PEOPLE.S REPUBLIC/)[0];
const headerLines=header.split(/\r?\n/).map(s=>s.replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim());
const headerMatch=headerLines.map(s=>s.match(/\b(MD|MST|ABU|MOHAMMAD)\s+([A-Z]{3,})(?:\s+([A-Z]{3,}))?/)).find(Boolean);
if(headerMatch&&printedSurname&&headerMatch[3]===printedSurname)printedName=[headerMatch[1],headerMatch[2],headerMatch[3]].join(' ');
else if(printedGiven&&printedSurname){
 const words=printedGiven.split(' ');
 const mrzGiven=best?.name?.slice(0,-printedSurname.length).trim()||'';
 const firstTwo=words.slice(0,2).join(' ');
 if(words.length>2&&mrzGiven.replace(/[^A-Z]/g,'').includes(firstTwo.replace(/ /g,'')))printedName=firstTwo+' '+printedSurname;
}
if(!printedName){
 const first=rows.slice(0,Math.max(1,rows.findIndex(s=>/FATHER|MOTHER|PERMANENT ADDRESS/i.test(s)))).map(clean);
 const candidate=first.find(s=>/\b(?:MD|MST|ABU|MOHAMMAD)\s+[A-Z]{3,}(?:\s+[A-Z]{3,}){0,2}\b/.test(s));
 if(candidate){const m=candidate.match(/\b(?:MD|MST|ABU|MOHAMMAD)\s+[A-Z]{3,}(?:\s+[A-Z]{3,}){0,2}\b/);if(m)printedName=m[0]}
}
if(best&&printedName)best.name=printedName;
for(const id of ['name','passport','dob','doe'])$(id).value=best?.[id]||'';
$('validation').textContent=best?'MRZ detected · '+best.score+'/3 checks passed. Verify all fields.':'MRZ not found. Try a sharper image or paste the MRZ lines.';
return best;
}
$('parse').onclick=()=>parse($('raw').value);
$('scan').onclick=async()=>{
if(busy)return;busy=true;$('scan').disabled=true;$('status').textContent='Reading MRZ…';
try{
if(!worker)worker=await Tesseract.createWorker('eng',1);
const image=$('preview');const canvas=document.createElement('canvas');const w=image.naturalWidth,h=image.naturalHeight;
if(!w||!h)throw Error('Image not loaded');
canvas.width=w;canvas.height=Math.round(h*.34);canvas.getContext('2d').drawImage(image,0,h-canvas.height,w,canvas.height,0,0,w,canvas.height);
await worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<',preserve_interword_spaces:'1'});
const result=await worker.recognize(canvas);
$('raw').value=result.data.text;parse(result.data.text);$('status').textContent='Scan complete. Review the fields.';
}catch(e){$('status').textContent='Scan failed: '+e.message}finally{busy=false;$('scan').disabled=false}
};
</script></html>
